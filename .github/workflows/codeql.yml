# CodeQL (framework §6, roadmap stuk 4): statische analyse van de TypeScript en de workflows, op elke PR, op main en
# wekelijks (nieuwe queries raken ook code die niet verandert). Gratis voor publieke repo's; een private app heeft
# GitHub Advanced Security nodig of zet deze workflow uit (ADR per app). Actions op volledige SHA; Renovate werkt ze bij.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  # Met het event erin breekt een push naar main de wekelijkse run niet af (en andersom).
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Permissies op jobniveau vervangen read-all helemaal; actions: read is nodig in private repo's.
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
