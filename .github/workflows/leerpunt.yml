# Issue-check voor leerpunten (ADR 0078 punt 3, spec leerlus-bewijs AC-5 t/m AC-7): toetst elk issue met label `leerpunt`
# aan het sjabloon en het sluitbewijs, en zet of haalt de labels `leerpunt-onvolledig` en `leerpunt-zonder-bewijs` weg met één
# comment per soort. Sluit, heropent of bewerkt niets (triage blijft bij de eigenaar). Geen PR-check: draait op `issues` en
# `issue_comment`, vanaf de default branch; alleen in de template-repo (`onderhoud.repository`, het script toetst dat).
name: leerpunt

on:
  issues:
    types: [opened, edited, labeled, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: leerpunt-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  leerpunt-check:
    name: leerpunt-check
    if: contains(github.event.issue.labels.*.name, 'leerpunt')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: node
      - name: leerpunt-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/kit/leerpunt-check.mjs
