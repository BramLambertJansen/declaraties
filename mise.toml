[tools]
node = "26.11.1"
# Selecteer de exacte projectpin vooraf; geen pnpm-versiewissel met globale cachewrites tijdens dagelijks werk (ADR 0061).
pnpm = '''{{ read_file(path='package.json') | split(pat='"packageManager"') | last | split(pat='"') | nth(n=1) | split(pat='@') | last }}'''
# Migraties (ADR 0042); alleen via scripts/db-migrate.sh.
dbmate = "2.36.0"
# Secret scanning (framework §6) in pre-commit en CI, altijd met -c scripts/kit/betterleaks.toml.
betterleaks = "1.9.0"
# Bekende kwetsbaarheden in pnpm-lock.yaml (framework §6), lokaal en in .github/workflows/osv.yml, altijd met osv-scanner.toml.
osv-scanner = "2.6.0"
